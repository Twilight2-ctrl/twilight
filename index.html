<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>迎日暮光云 // TWILIGHT</title>
<style>
:root {
  --bg: #F5EFE0; --bg-light: #FBF6EA; --fg: #2C2410; --fg-sub: #8C8268;
  --line: #E0D5B8; --line-light: #EDE5CC; --accent: #C4956A;
  --vhs-r: #D4534A; --vhs-y: #D4A839; --vhs-b: #6B5F9E;
  --font-stack: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
  --font-mono: "SF Mono", "Consolas", "Menlo", monospace;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; height: 100%; background: var(--bg); color: var(--fg); font-family: var(--font-stack); overflow: hidden; }
.screen { position: fixed; inset: 0; display: flex; flex-direction: column; z-index: 10; }
.hidden { display: none !important; }
.mono { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.5px; color: var(--fg-sub); }

/* 身份页 */
#auth { padding: 48px 32px; justify-content: center; max-width: 480px; margin: 0 auto; width: 100%; background: var(--bg); }
.brand { text-align: center; margin-bottom: 48px; }
.brand h1 { font-size: 24px; font-weight: 600; letter-spacing: 8px; margin: 0 0 12px; color: var(--fg); }
.brand .sub { font-size: 11px; letter-spacing: 6px; color: var(--fg-sub); text-transform: uppercase; }
.vhs-bar { display: flex; height: 2px; width: 80px; margin: 24px auto 0; overflow: hidden; }
.vhs-bar div { flex: 1; } .vhs-bar .r { background: var(--vhs-r); } .vhs-bar .y { background: var(--vhs-y); } .vhs-bar .b { background: var(--vhs-b); }
.auth-btn { display: flex; align-items: center; justify-content: space-between; padding: 18px 20px; border: 1px solid var(--line); border-radius: 12px; margin-bottom: 12px; font-size: 15px; background: var(--bg-light); transition: all 0.2s; }
.auth-btn:active { background: var(--line-light); } .auth-btn.author { border-color: var(--accent); } .auth-btn.guest { color: var(--fg-sub); }
.auth-btn .arrow { color: var(--fg-sub); font-family: var(--font-mono); }
#keyInput { width: 100%; padding: 16px; border: 1px solid var(--line); border-radius: 12px; margin-bottom: 12px; font-size: 15px; outline: none; text-align: center; letter-spacing: 4px; background: var(--bg-light); color: var(--fg); }
#keyInput:focus { border-color: var(--accent); }

/* 社区入口 */
#entry { justify-content: center; align-items: center; background: var(--bg); }
#entry .btn-community { padding: 20px 64px; border: 1px solid var(--fg); border-radius: 2px; font-size: 14px; letter-spacing: 12px; font-weight: 500; position: relative; background: transparent; transition: all 0.3s; color: var(--fg); }
#entry .btn-community:hover { background: var(--fg); color: var(--bg); }
#entry .btn-community::before, #entry .btn-community::after { content: ''; position: absolute; width: 6px; height: 6px; border: 1px solid var(--fg); }
#entry .btn-community::before { top: -1px; left: -1px; border-right: none; border-bottom: none; }
#entry .btn-community::after { bottom: -1px; right: -1px; border-left: none; border-top: none; }

/* 开篇动画 */
#intro { background: #0a0a0f; justify-content: center; align-items: center; z-index: 20; transition: background 1s ease; }
#intro.transitioning { background: var(--bg); }
#intro svg { width: 100%; height: 50%; max-height: 300px; transition: transform 1.2s ease, opacity 1.2s ease; }
#intro.transitioning svg { transform: translateY(-40px) scale(1.05); opacity: 0; }
.rail { fill: none; stroke-linecap: round; }
.name-reveal { position: absolute; bottom: 20%; text-align: center; opacity: 0; transform: translateY(20px); transition: all 1s cubic-bezier(0.16, 1, 0.3, 1); }
.name-reveal.show { opacity: 1; transform: translateY(0); }
#intro.transitioning .name-reveal { opacity: 0; transform: translateY(-30px); transition: all 1s ease; }
.name-reveal .cn { font-size: 20px; letter-spacing: 12px; color: #FFF; font-weight: 300; margin-bottom: 8px; }
.name-reveal .en { font-family: var(--font-mono); font-size: 10px; letter-spacing: 16px; color: #8E8E93; }

/* 主页 */
#app { z-index: 5; background: var(--bg); opacity: 0; transform: translateY(30px); transition: opacity 0.8s ease-out, transform 0.8s ease-out; }
#app.show { opacity: 1; transform: translateY(0); }
.topbar { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--line); background: rgba(245,239,224,0.95); backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 100; }
.topbar .title { font-size: 14px; font-weight: 600; letter-spacing: 4px; }
.topbar .actions { display: flex; gap: 12px; align-items: center; }
.topbar .switch { font-size: 12px; color: var(--fg-sub); border: 1px solid var(--line); padding: 6px 12px; border-radius: 16px; }
.topbar .online { font-size: 11px; color: var(--accent); }
.tab-bar { display: flex; gap: 0; border-bottom: 1px solid var(--line); background: var(--bg-light); }
.tab-btn { flex: 1; padding: 14px 20px; font-size: 14px; text-align: center; border: none; background: none; color: var(--fg-sub); cursor: pointer; position: relative; transition: color 0.2s; }
.tab-btn.active { color: var(--fg); font-weight: 600; }
.tab-btn.active::after { content: ''; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 32px; height: 2px; background: var(--accent); border-radius: 1px; }
.announcement { padding: 14px 16px; border-bottom: 1px solid var(--line-light); background: var(--bg-light); }
.announce-text { font-size: 13px; line-height: 1.6; color: var(--fg); white-space: pre-wrap; }
.announce-empty { font-size: 13px; color: var(--fg-sub); font-style: italic; }
.edit-btn { margin-top: 8px; font-size: 12px; color: var(--accent); border: 1px solid var(--line); padding: 4px 12px; border-radius: 6px; }
.announce-edit { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 10px; font-size: 13px; outline: none; resize: none; min-height: 80px; font-family: inherit; background: var(--bg); color: var(--fg); margin-bottom: 8px; }
.announce-save { font-size: 12px; color: #FFF; background: var(--accent); border: none; padding: 6px 16px; border-radius: 6px; }
.feed { flex: 1; overflow-y: auto; padding: 16px 16px 100px; -webkit-overflow-scrolling: touch; }
.feed-inner { max-width: 680px; margin: 0 auto; }
.featured-video { width: 100%; background: #000; position: relative; margin-bottom: 16px; border-radius: 12px; overflow: hidden; }
.featured-video video { width: 100%; max-height: 50vh; object-fit: contain; display: block; }
.featured-label { position: absolute; top: 12px; left: 12px; background: rgba(0,0,0,0.6); color: #FFF; padding: 4px 10px; border-radius: 4px; font-size: 11px; letter-spacing: 2px; font-family: var(--font-mono); }
.post { border: 1px solid var(--line); border-radius: 14px; padding: 18px 16px; background: var(--bg-light); margin-bottom: 16px; }
.post-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.post-author { font-size: 14px; font-weight: 600; color: var(--fg); }
.post-author .badge { font-size: 10px; background: var(--accent); color: #fff; padding: 2px 6px; border-radius: 4px; margin-right: 6px; }
.post-time { font-size: 11px; color: var(--fg-sub); font-family: var(--font-mono); }
.post-content { font-size: 14px; line-height: 1.7; color: var(--fg); white-space: pre-wrap; margin-bottom: 10px; }
.post-media { position: relative; width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; scroll-snap-type: x mandatory; display: flex; scrollbar-width: none; margin-bottom: 10px; border-radius: 8px; }
.post-media::-webkit-scrollbar { display: none; }
.post-media img, .post-media video { width: 100%; height: auto; max-height: 55vh; object-fit: contain; scroll-snap-align: start; flex-shrink: 0; background: #000; }
.media-counter { position: absolute; top: 12px; right: 12px; background: rgba(0,0,0,0.6); color: #FFF; padding: 4px 10px; border-radius: 12px; font-family: var(--font-mono); font-size: 11px; }
.post-actions { display: flex; align-items: center; gap: 16px; padding: 10px 0; border-bottom: 1px solid var(--line-light); margin-bottom: 10px; }
.action-btn { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--fg-sub); background: none; border: none; padding: 0; cursor: pointer; transition: color 0.2s; }
.action-btn:active { opacity: 0.6; } .action-btn.liked { color: var(--vhs-r); }
.action-btn svg { width: 17px; height: 17px; stroke: currentColor; stroke-width: 1.5; fill: none; }
.action-btn.liked svg { fill: var(--vhs-r); stroke: var(--vhs-r); }
.dm-section { } .dm-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; max-height: 140px; overflow-y: auto; }
.dm-item { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; line-height: 1.5; }
.dm-user { font-family: var(--font-mono); font-size: 11px; color: var(--accent); white-space: nowrap; padding-top: 2px; flex-shrink: 0; }
.dm-text { color: var(--fg); flex: 1; }
.dm-block { font-size: 11px; color: var(--fg-sub); cursor: pointer; padding: 2px 6px; border: 1px solid var(--line); border-radius: 4px; flex-shrink: 0; }
.dm-block:active { background: var(--line-light); }
.dm-form { display: flex; gap: 8px; border: 1px solid var(--line); border-radius: 12px; padding: 4px 4px 4px 16px; background: var(--bg); }
.dm-form input { flex: 1; border: none; background: transparent; outline: none; font-size: 14px; padding: 8px 0; color: var(--fg); }
.dm-form button { background: var(--accent); color: #FFF; border: none; border-radius: 8px; padding: 8px 16px; font-size: 13px; font-weight: 500; }
.fab { position: fixed; right: 20px; bottom: 24px; width: 52px; height: 52px; border-radius: 50%; background: var(--accent); color: #FFF; display: flex; align-items: center; justify-content: center; font-size: 24px; box-shadow: 0 8px 24px rgba(196,149,106,0.3); z-index: 50; transition: transform 0.2s; }
.fab:active { transform: scale(0.92); }
.modal { position: fixed; inset: 0; background: rgba(44,36,16,0.5); backdrop-filter: blur(4px); z-index: 200; display: flex; align-items: flex-end; }
.sheet { width: 100%; max-width: 680px; margin: 0 auto; background: var(--bg); border-radius: 20px 20px 0 0; padding: 24px 20px 34px; max-height: 90vh; overflow-y: auto; animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
.sheet-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
.sheet-header h3 { margin: 0; font-size: 16px; font-weight: 600; letter-spacing: 2px; }
.sheet-header .close { width: 32px; height: 32px; border-radius: 50%; background: var(--line-light); display: flex; align-items: center; justify-content: center; font-size: 18px; color: var(--fg-sub); }
.upload-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
.upload-btn { padding: 20px 16px; border: 1px dashed var(--line); border-radius: 12px; text-align: center; font-size: 13px; color: var(--fg-sub); display: flex; flex-direction: column; align-items: center; gap: 8px; }
.upload-btn svg { width: 22px; height: 22px; stroke: currentColor; stroke-width: 1.5; fill: none; }
.checkbox-row { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; font-size: 14px; }
.checkbox-row input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--accent); }
.checkbox-row select { border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-size: 13px; background: var(--bg-light); color: var(--fg); outline: none; }
.preview-grid { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; }
.preview-item { position: relative; width: calc(33.333% - 7px); aspect-ratio: 1; border-radius: 8px; overflow: hidden; background: var(--line-light); }
.preview-item img, .preview-item video { width: 100%; height: 100%; object-fit: cover; }
.preview-item .remove { position: absolute; top: 4px; right: 4px; width: 24px; height: 24px; border-radius: 50%; background: rgba(0,0,0,0.6); color: #FFF; display: flex; align-items: center; justify-content: center; font-size: 14px; }
.text-input { width: 100%; border: 1px solid var(--line); border-radius: 12px; padding: 14px; font-size: 14px; line-height: 1.6; outline: none; resize: none; min-height: 90px; margin-bottom: 16px; font-family: inherit; background: var(--bg-light); color: var(--fg); }
.text-input:focus { border-color: var(--accent); }
.publish-btn { width: 100%; padding: 14px; background: var(--accent); color: #FFF; border: none; border-radius: 12px; font-size: 15px; font-weight: 600; letter-spacing: 2px; }
.publish-btn:disabled { opacity: 0.5; }
.toast { position: fixed; left: 50%; bottom: 100px; transform: translateX(-50%) translateY(20px); background: var(--fg); color: var(--bg); padding: 12px 24px; border-radius: 24px; font-size: 13px; opacity: 0; transition: all 0.3s; z-index: 1000; pointer-events: none; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.empty { text-align: center; padding: 60px 20px; color: var(--fg-sub); }
.empty .icon { font-size: 48px; margin-bottom: 16px; opacity: 0.2; }
</style>
</head>
<body>

<section id="auth" class="screen">
  <div class="brand">
    <h1>迎日暮光云</h1>
    <div class="sub">Twilight System</div>
    <div class="vhs-bar"><div class="r"></div><div class="y"></div><div class="b"></div></div>
  </div>
  <button class="auth-btn author" onclick="showKeyInput()"><span>作者通道</span><span class="arrow">→</span></button>
  <input id="keyInput" class="hidden" type="password" placeholder="输入密钥" onkeydown="if(event.key==='Enter')verifyAuthor()">
  <button id="verifyBtn" class="auth-btn author hidden" onclick="verifyAuthor()"><span>验证密钥</span><span class="arrow">→</span></button>
  <button class="auth-btn guest" onclick="enterAsGuest()"><span>游客访问</span><span class="arrow">→</span></button>
  <div style="text-align:center; margin-top:24px;" class="mono" id="connectStatus">连接中…</div>
</section>

<section id="entry" class="screen hidden">
  <button class="btn-community" onclick="startIntro()">社 区</button>
</section>

<section id="intro" class="screen hidden">
  <svg viewBox="0 0 400 200" preserveAspectRatio="xMidYMid meet">
    <path class="rail" stroke="#333" stroke-width="1" d="M200,200 L200,20"/>
    <path class="rail" stroke="#555" stroke-width="1.5" d="M80,200 Q140,110 200,20"/>
    <path class="rail" stroke="#555" stroke-width="1.5" d="M320,200 Q260,110 200,20"/>
    <path class="rail" stroke="#222" stroke-width="2" d="M140,200 Q170,100 200,20"/>
    <path class="rail" stroke="#222" stroke-width="2" d="M260,200 Q230,100 200,20"/>
    <path class="rail" stroke="#FFF" stroke-width="2.5" d="M200,200 L200,20"/>
  </svg>
  <div class="name-reveal" id="nameReveal">
    <div class="cn">迎日暮光云</div>
    <div class="en">T W I L I G H T</div>
  </div>
</section>

<section id="app" class="screen hidden">
  <div class="topbar">
    <div class="title">TWILIGHT</div>
    <div class="actions">
      <span class="online" id="onlineDot">● 离线</span>
      <span class="mono" id="roleLabel"></span>
      <button class="switch" onclick="resetAll()">切换</button>
    </div>
  </div>
  <div class="tab-bar">
    <button class="tab-btn active" onclick="switchTab('preview', this)">预告</button>
    <button class="tab-btn" onclick="switchTab('completed', this)">已完成</button>
  </div>
  <div class="announcement" id="announcement"></div>
  <div class="feed"><div class="feed-inner" id="feedInner"></div></div>
  <button id="fab" class="fab hidden" onclick="openPublish()">+</button>
</section>

<div id="modal" class="modal hidden" onclick="if(event.target===this)closePublish()">
  <div class="sheet">
    <div class="sheet-header"><h3>发布内容</h3><button class="close" onclick="closePublish()">×</button></div>
    <div class="upload-actions">
      <label class="upload-btn"><svg viewBox="0 0 24 24"><path d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg><span>相册选图</span><input type="file" accept="image/*" multiple class="hidden" onchange="handleFiles(event, 'image')"></label>
      <label class="upload-btn"><svg viewBox="0 0 24 24"><path d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg><span>相册视频</span><input type="file" accept="video/*" class="hidden" onchange="handleFiles(event, 'video')"></label>
    </div>
    <label class="checkbox-row"><input type="checkbox" id="featuredCheck"> 设为主页置顶视频</label>
    <label class="checkbox-row">专栏：
      <select id="columnSelect"><option value="preview">预告</option><option value="completed">已完成</option></select>
    </label>
    <div class="preview-grid" id="previewGrid"></div>
    <textarea id="postText" class="text-input" placeholder="写下你的文字（选填）"></textarea>
    <button class="publish-btn" id="publishBtn" onclick="submitPost()">发 布</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ===== 全局状态（联网版）=====
const AUTHOR_NAME = "迎日暮光云Twilight";
let currentRole = 'guest', currentName = '', authorToken = '';
let currentTab = 'preview';
let posts = [], blockedDms = [], likedPosts = JSON.parse(localStorage.getItem('twilight_likes') || '[]');
let ws = null, online = false;

const $ = id => document.getElementById(id);
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 2000); }
function esc(s) { return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function api(path, opts = {}) { return fetch(path, opts).then(r => r.json()); }

// ===== WebSocket 实时同步 =====
function connectWS() {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const url = `${proto}//${location.host}/ws`;
  try { ws = new WebSocket(url); } catch(e) { return; }
  ws.onopen = () => { online = true; updateOnline(); };
  ws.onclose = () => { online = false; updateOnline(); setTimeout(connectWS, 3000); };
  ws.onerror = () => { online = false; updateOnline(); };
  ws.onmessage = (e) => {
    let msg; try { msg = JSON.parse(e.data); } catch(_) { return; }
    handleRealtime(msg);
  };
}
function updateOnline() {
  const dot = $('onlineDot');
  if (dot) { dot.textContent = online ? '● 在线' : '● 离线'; dot.style.color = online ? 'var(--accent)' : 'var(--fg-sub)'; }
}
function handleRealtime(msg) {
  switch (msg.type) {
    case 'post:new':
      if (!posts.find(p => p.id === msg.post.id)) { posts.unshift(msg.post); renderFeed(); }
      break;
    case 'post:update':
      { const i = posts.findIndex(p => p.id === msg.post.id); if (i >= 0) { posts[i] = msg.post; renderFeed(); } break; }
    case 'danmaku:new':
      { const p = posts.find(x => x.id === msg.postId); if (p) { p.danmaku = p.danmaku || []; if (!p.danmaku.find(d => d.id === msg.dm.id)) p.danmaku.push(msg.dm); renderFeed(); } break; }
    case 'block:new':
      if (!blockedDms.includes(msg.key)) blockedDms.push(msg.key); renderFeed(); break;
    case 'announce:update':
      if (msg.column === currentTab) loadAnnounce(); break;
  }
}

// ===== 身份 =====
function showKeyInput() { $('keyInput').classList.remove('hidden'); $('verifyBtn').classList.remove('hidden'); $('keyInput').focus(); }
async function verifyAuthor() {
  const key = $('keyInput').value.trim();
  const res = await api('/api/auth', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ key }) });
  if (!res.ok) { toast(res.error || '密钥错误'); return; }
  currentRole = 'author'; currentName = AUTHOR_NAME; authorToken = res.token;
  sessionStorage.setItem('role', 'author'); enterEntry();
}
function enterAsGuest() { currentRole = 'guest'; currentName = '游客_' + Math.random().toString(36).substr(2, 4); sessionStorage.setItem('role', 'guest'); sessionStorage.setItem('guestName', currentName); enterEntry(); }
function enterEntry() { $('auth').classList.add('hidden'); $('entry').classList.remove('hidden'); }

// ===== 开篇动画 =====
function startIntro() {
  $('entry').classList.add('hidden'); $('intro').classList.remove('hidden');
  const rails = document.querySelectorAll('.rail');
  rails.forEach(r => { const len = r.getTotalLength(); r.style.strokeDasharray = len; r.style.strokeDashoffset = len; r.style.transition = 'none'; });
  requestAnimationFrame(() => { rails.forEach((r, i) => { setTimeout(() => { r.style.transition = `stroke-dashoffset 1.8s cubic-bezier(0.4, 0, 0.2, 1)`; r.style.strokeDashoffset = '0'; }, i * 150); }); });
  setTimeout(() => $('nameReveal').classList.add('show'), 1200);
  setTimeout(() => $('intro').classList.add('transitioning'), 2800);
  setTimeout(enterApp, 4200);
}

// ===== 主页 =====
async function enterApp() {
  $('intro').classList.add('hidden'); $('app').classList.remove('hidden');
  requestAnimationFrame(() => { requestAnimationFrame(() => $('app').classList.add('show')); });
  $('roleLabel').textContent = currentRole === 'author' ? 'AUTHOR' : currentName.toUpperCase();
  $('fab').classList.toggle('hidden', currentRole !== 'author');
  connectWS();
  await loadState();
}

// 从服务器拉取全量数据
async function loadState() {
  const res = await api('/api/state');
  if (res.ok) { posts = res.posts || []; blockedDms = res.blockedDms || []; }
  renderAnnouncement(); renderFeed();
}
async function loadAnnounce() {
  const res = await api('/api/announce?column=' + currentTab);
  const el = $('announcement');
  const text = res.ok ? res.text : '';
  if (currentRole === 'author') {
    el.innerHTML = (text ? `<div class="announce-text">${esc(text)}</div>` : `<div class="announce-empty">暂无公告</div>`) + `<button class="edit-btn" onclick="editAnnounce()">编辑</button>`;
  } else {
    el.innerHTML = text ? `<div class="announce-text">${esc(text)}</div>` : '';
  }
}
function renderAnnouncement() { loadAnnounce(); }
function editAnnounce() {
  const cur = ($('announcement').querySelector('.announce-text') || {}).textContent || '';
  $('announcement').innerHTML = `<textarea class="announce-edit" id="announceEdit">${esc(cur)}</textarea><button class="announce-save" onclick="saveAnnounce()">保存</button>`;
  $('announceEdit').focus();
}
async function saveAnnounce() {
  const text = $('announceEdit').value.trim();
  await api('/api/announce', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Author-Token': AUTHOR_KEY_CONST() }, body: JSON.stringify({ column: currentTab, text }) });
  renderAnnouncement(); toast('公告已更新');
}
function AUTHOR_KEY_CONST() { return authorToken || (currentRole === 'author' ? '20100423' : ''); }

function switchTab(tab, btn) { currentTab = tab; document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active')); btn.classList.add('active'); renderAnnouncement(); renderFeed(); }

// ===== 渲染 Feed =====
function mediaUrl(fileRef) { return '/uploads/' + encodeURIComponent(fileRef.file); }
function renderFeed() {
  const container = $('feedInner');
  const filtered = posts.filter(p => (p.column || 'preview') === currentTab);
  container.innerHTML = '';
  const featured = filtered.find(p => p.isFeatured && p.media && p.media.length > 0);
  if (featured) {
    const fv = document.createElement('div'); fv.className = 'featured-video';
    const m = featured.media[0];
    fv.innerHTML = `<div class="featured-label">FEATURED VIDEO</div>` + (m.mime && m.mime.startsWith('image') ? `<img src="${mediaUrl(m)}" style="width:100%;max-height:50vh;object-fit:contain;display:block;">` : `<video src="${mediaUrl(m)}" controls style="width:100%;max-height:50vh;object-fit:contain;display:block;"></video>`);
    container.appendChild(fv);
  }
  if (filtered.length === 0) { container.innerHTML += `<div class="empty"><div class="icon">∅</div><div>暂无内容</div></div>`; return; }

  for (const post of filtered) {
    const card = document.createElement('div'); card.className = 'post';
    let mediaHtml = '';
    if (post.media && post.media.length > 0) {
      const items = post.media.map(m => m.mime && m.mime.startsWith('image') ? `<img src="${mediaUrl(m)}">` : `<video src="${mediaUrl(m)}" controls></video>`);
      mediaHtml = `<div class="post-media">${items.join('')}${items.length > 1 ? `<div class="media-counter mono">1 / ${items.length}</div>` : ''}</div>`;
    }
    const isLiked = likedPosts.includes(post.id);
    const likeCount = (post.likes || []).length;
    const visibleDms = (post.danmaku || []).filter(d => !blockedDms.includes(`${post.id}:${d.id}`));
    const dmHtml = visibleDms.map(d => `<div class="dm-item"><span class="dm-user">${esc(d.user)}</span><span class="dm-text">${esc(d.text)}</span>${currentRole==='author'?`<span class="dm-block" onclick="blockDm(${post.id},'${d.id}')">屏蔽</span>`:''}</div>`).join('');
    card.innerHTML = `
      <div class="post-header"><span class="post-author"><span class="badge">作者</span>${esc(post.author)}</span><span class="post-time">${new Date(post.time || post.id).toLocaleString('zh-CN', {hour12: false})}</span></div>
      ${post.text ? `<div class="post-content">${esc(post.text)}</div>` : ''}
      ${mediaHtml}
      <div class="post-actions">
        <button class="action-btn ${isLiked ? 'liked' : ''}" onclick="toggleLike(${post.id}, this)"><svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg><span class="like-count">${likeCount}</span></button>
        <span class="action-btn"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg> 弹幕</span>
      </div>
      <div class="dm-section">
        <div class="dm-list">${dmHtml || '<div class="mono" style="padding:12px 0; text-align:center;">暂无弹幕</div>'}</div>
        <div class="dm-form"><input placeholder="发送弹幕…" onkeydown="if(event.key==='Enter')sendDanmaku(${post.id}, this)"><button onclick="sendDanmaku(${post.id}, this.previousElementSibling)">发送</button></div>
      </div>`;
    container.appendChild(card);
  }
}

// ===== 点赞 =====
async function toggleLike(postId, btn) {
  if (likedPosts.includes(postId)) { toast('已经点过赞了'); return; }
  const res = await api('/api/like', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ postId, user: currentName }) });
  if (res.ok) { likedPosts.push(postId); localStorage.setItem('twilight_likes', JSON.stringify(likedPosts)); btn.classList.add('liked'); btn.querySelector('.like-count').textContent = res.likes; toast('点赞成功'); }
}

// ===== 弹幕 =====
async function sendDanmaku(postId, input) {
  const text = input.value.trim(); if (!text) return;
  const dmId = postId + '_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4);
  const res = await api('/api/danmaku', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ postId, dmId, user: currentName, text }) });
  if (res.ok) { input.value = ''; if (!online) { await loadState(); } }
}
async function blockDm(postId, dmId) {
  await api('/api/block', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Author-Token': AUTHOR_KEY_CONST() }, body: JSON.stringify({ postId, dmId }) });
  toast('已屏蔽');
}

// ===== 发布（先传媒体，再发内容）=====
let pendingFiles = []; // [{file: File, kind:'image'|'video'}]
function openPublish() { $('modal').classList.remove('hidden'); $('columnSelect').value = currentTab; }
function closePublish() { $('modal').classList.add('hidden'); pendingFiles = []; $('previewGrid').innerHTML = ''; $('postText').value = ''; $('featuredCheck').checked = false; document.querySelectorAll('.upload-btn input').forEach(i => i.value = ''); }
function handleFiles(e, kind) { pendingFiles.push(...Array.from(e.target.files).map(f => ({ file: f, kind }))); renderPreviews(); e.target.value = ''; }
function renderPreviews() {
  const grid = $('previewGrid'); grid.innerHTML = '';
  pendingFiles.forEach((pf, i) => {
    const url = URL.createObjectURL(pf.file);
    const div = document.createElement('div'); div.className = 'preview-item';
    div.innerHTML = (pf.kind === 'image' ? `<img src="${url}">` : `<video src="${url}"></video>`) + `<button class="remove" onclick="removePending(${i})">×</button>`;
    grid.appendChild(div);
  });
}
function removePending(i) { pendingFiles.splice(i, 1); renderPreviews(); }

async function submitPost() {
  if (currentRole !== 'author') { toast('仅作者可发布'); return; }
  const text = $('postText').value.trim();
  if (!text && pendingFiles.length === 0) { toast('请选择图片/视频或输入文字'); return; }
  const btn = $('publishBtn'); btn.disabled = true; btn.textContent = '发布中…';
  try {
    // 1. 上传媒体（逐个，复用同一 token）
    const media = [];
    for (const pf of pendingFiles) {
      const form = new FormData(); form.append('file', pf.file, pf.file.name);
      const res = await fetch('/api/upload', { method: 'POST', headers: { 'X-Author-Token': AUTHOR_KEY_CONST() }, body: form });
      const j = await res.json();
      if (j.ok && j.files && j.files[0]) media.push(j.files[0]);
    }
    // 2. 发布内容
    const column = $('columnSelect').value;
    const isFeatured = $('featuredCheck').checked && media.some(m => !(m.mime || '').startsWith('image'));
    await api('/api/posts', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Author-Token': AUTHOR_KEY_CONST() }, body: JSON.stringify({ text, media, column, isFeatured }) });
    closePublish(); toast('发布成功');
    if (!online) await loadState();
  } catch (e) { toast('发布失败：' + e.message); }
  finally { btn.disabled = false; btn.textContent = '发 布'; }
}

function resetAll() { sessionStorage.clear(); localStorage.removeItem('twilight_likes'); location.reload(); }

// ===== 初始化 =====
(async function init() {
  const savedRole = sessionStorage.getItem('role');
  if (savedRole) { currentRole = savedRole; currentName = savedRole === 'author' ? AUTHOR_NAME : (sessionStorage.getItem('guestName') || '游客'); enterEntry(); }
})();
</script>
